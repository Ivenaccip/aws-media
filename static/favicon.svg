<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Estudio de video">
  <!-- El núcleo del orbe, los mismos tres degradados que .orbe-css en orbe.js:
       ámbar arriba a la izquierda, azul abajo a la derecha, medianoche debajo.
       Media docena de pantallas te dicen «puedes cerrar la pestaña y volver»:
       sin favicon, volver era buscar a ciegas entre veinte papeles en blanco. -->
  <defs>
    <radialGradient id="f" cx="50%" cy="50%" r="72%">
      <stop offset="0" stop-color="#1E2C42"/><stop offset="1" stop-color="#070E18"/>
    </radialGradient>
    <radialGradient id="a" cx="32%" cy="24%" r="62%">
      <stop offset="0" stop-color="#F0A94A"/><stop offset="1" stop-color="#F0A94A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="z" cx="68%" cy="78%" r="64%">
      <stop offset="0" stop-color="#5B8DD6"/><stop offset="1" stop-color="#5B8DD6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="16" cy="16" r="15.5" fill="url(#f)"/>
  <circle cx="16" cy="16" r="15.5" fill="url(#a)"/>
  <circle cx="16" cy="16" r="15.5" fill="url(#z)"/>
</svg>
