<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Estudio de video">
  <!-- El núcleo del orbe, los mismos tres degradados que .orbe-css en orbe.js.
       Media docena de pantallas te dicen «puedes cerrar la pestaña y volver»:
       sin favicon, volver significa buscar a ciegas entre veinte papeles en
       blanco. -->
  <defs>
    <radialGradient id="f" cx="50%" cy="50%" r="72%">
      <stop offset="0" stop-color="#2a1e46"/><stop offset="1" stop-color="#0d0a18"/>
    </radialGradient>
    <radialGradient id="p" cx="32%" cy="24%" r="62%">
      <stop offset="0" stop-color="#b28cff"/><stop offset="1" stop-color="#b28cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="t" cx="68%" cy="78%" r="64%">
      <stop offset="0" stop-color="#3ce0c0"/><stop offset="1" stop-color="#3ce0c0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="16" cy="16" r="15.5" fill="url(#f)"/>
  <circle cx="16" cy="16" r="15.5" fill="url(#p)"/>
  <circle cx="16" cy="16" r="15.5" fill="url(#t)"/>
</svg>
