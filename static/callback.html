<!doctype html>
<html lang="es">
<!-- M2: aterrizaje del Hosted UI de Cognito. Canjea el ?code por tokens con el
     code_verifier de PKCE (sessionStorage, lo dejó auth.js) y vuelve a la
     página que pidió el login. Sin backend: el canje va directo a Cognito. -->
<head>
  <meta charset="utf-8">
  <title>Entrando…</title>
  <style>body{background:#0e1013;color:#e8e6e0;font:15px system-ui;display:grid;place-items:center;height:100vh;margin:0}</style>
</head>
<body>
<p id="msg">Entrando…</p>
<script src="/auth.js"></script>
<script>
(async () => {
  const code = new URLSearchParams(location.search).get('code');
  const verifier = sessionStorage.getItem('auth_verifier');
  const volver = sessionStorage.getItem('auth_volver') || '/';
  if (!code || !verifier) { location.replace('/'); return; }
  try {
    const c = await window.auth.config();
    const r = await fetch('https://' + c.dominio + '/oauth2/token', {
      method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'grant_type=authorization_code&client_id=' + c.client_id +
        '&code=' + encodeURIComponent(code) +
        '&redirect_uri=' + encodeURIComponent(location.origin + '/callback.html') +
        '&code_verifier=' + verifier,
    });
    if (!r.ok) throw new Error('canje ' + r.status);
    window.auth.guardarTokens(await r.json());
    sessionStorage.removeItem('auth_verifier');
    location.replace(volver);
  } catch (e) {
    document.getElementById('msg').textContent =
      'No se pudo iniciar sesión — vuelve a intentarlo desde la portada.';
    setTimeout(() => location.replace('/'), 3000);
  }
})();
</script>
</body>
</html>
