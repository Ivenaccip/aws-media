# A4 (plan AWS): valida en cada push que la imagen única construye en Linux,
# que la suite completa corre verde DENTRO del contenedor y que el server
# arranca y responde sin .env (las keys solo hacen falta al usar cada API).
#
# Dos ramas (ver docs/OPERACION.md § Ramas): «dev» integra, «main» es lo que
# corre en AWS. El build y los tests corren en las dos y en cada PR; el push a
# ECR corre SOLO desde main, y eso no es una preferencia de estilo:
# la Lambda de producción consume la etiqueta «latest» de ese mismo repositorio
# de ECR. Si dev también empujara, el siguiente «cdk deploy» — hecho desde
# donde fuera — se llevaría código de dev a producción. Con un solo entorno
# AWS, esa guarda es la única frontera entre lo que se prueba y lo que ven los
# testers.
name: docker

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write   # OIDC hacia AWS (rol aws-media-github-ecr, sin access keys)
  contents: read

jobs:
  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Primero, y fuera del contenedor: .dockerignore excluye .github/ (el CI no
      # viaja en la imagen de producción), así que estos tests se saltan ahí
      # dentro y solo pueden correr aquí. Van antes del build para fallar en
      # segundos en vez de tras varios minutos de docker build.
      # --noconftest: tests/conftest.py importa pipeline.config, y estas reglas
      # solo leen dos archivos de texto — no hacen falta las deps del proyecto.
      - name: Reglas del repo (dos ramas y frontera con producción)
        run: |
          pip install --quiet pytest
          python -m pytest tests/test_flujo_ramas.py -q --noconftest

      - name: Build de la imagen
        run: docker build -t aws-media:ci .

      - name: Suite de tests dentro del contenedor
        run: docker run --rm aws-media:ci python -m pytest tests -q

      - name: Smoke del server (sin .env, MEDIA_ROOT vacío)
        run: |
          docker run -d --name app -p 8011:8011 aws-media:ci
          ok=""
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8011/api/estilos > /dev/null; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then echo "el server no respondió"; docker logs app; exit 1; fi
          echo "— /api/estilos:"; curl -fs http://localhost:8011/api/estilos
          echo "— /api/edicion/proyectos (MEDIA_ROOT vacío → []):"
          curl -fs http://localhost:8011/api/edicion/proyectos
          echo "— f1 (static):"; curl -fs http://localhost:8011/ | head -c 200; echo
          docker logs app

      - name: Runtimes de render presentes (Node/Chromium/ffmpeg)
        run: |
          docker run --rm aws-media:ci sh -c "node --version && ffmpeg -version | head -1 && chromium --version"

      # Solo si TODO lo anterior pasó Y estamos en main: la imagen validada se
      # publica en ECR (C1 — la Lambda del API la consume por el tag latest).
      # Desde dev o desde un PR se construye y se prueba, pero NO se publica.
      - name: Debug claims OIDC (iss/aud/sub — no son secretos)
        if: github.ref == 'refs/heads/main'
        run: |
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq '{iss, aud, sub}' || true

      - name: Credenciales AWS (OIDC)
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::191241816158:role/aws-media-github-ecr
          aws-region: us-east-1

      - name: Push a ECR (latest + sha)
        if: github.ref == 'refs/heads/main'
        run: |
          ECR=191241816158.dkr.ecr.us-east-1.amazonaws.com
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin $ECR
          docker tag aws-media:ci $ECR/aws-media:latest
          docker tag aws-media:ci $ECR/aws-media:${{ github.sha }}
          docker push --all-tags $ECR/aws-media
